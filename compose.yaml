name: food-flow
services:
  app:
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
      FOOD_FLOW_DB: /var/lib/food-flow/food-flow.sqlite
      FOOD_FLOW_TRUST_PROXY: "1"
    volumes:
      - food_flow_data:/var/lib/food-flow
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      FOOD_FLOW_DOMAIN: ${FOOD_FLOW_DOMAIN:?Defina FOOD_FLOW_DOMAIN no arquivo .env}
      ACME_EMAIL: ${ACME_EMAIL:?Defina ACME_EMAIL no arquivo .env}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  food_flow_data:
  caddy_data:
  caddy_config:
